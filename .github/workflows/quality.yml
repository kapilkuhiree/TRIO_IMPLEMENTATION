name: TRIO quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIO_TEST_MODE: "1"
      TRIO_BROKER_PROVIDER: paper
      TRIO_REMOTE_REQUIRED: "0"
      TRIO_LIVE: "0"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements-server.lock
      - name: Install CI dependencies
        run: python -m pip install --require-hashes -r requirements-server.lock
      - name: Compile
        run: python -m compileall -q src scripts main.py
      - name: Test
        run: python scripts/test_offline.py
