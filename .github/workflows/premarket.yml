name: TRIO premarket plan

# Runs after the NSE close, ranks the NIFTY 100 on daily bars, writes
# an optional research preview for the next session, and Telegrams a summary.
# The options-only session never reads or executes this artifact.
# Cron is UTC: 10:00 UTC = 15:30 IST, Mon-Fri.

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_OPTIONS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPTIONS_BOT_TOKEN }}
      TELEGRAM_OPTIONS_CHAT_ID: ${{ secrets.TELEGRAM_OPTIONS_CHAT_ID }}
      MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
      TRIO_BROKER_PROVIDER: megabull
      TRIO_REMOTE_REQUIRED: "1"
      TRIO_ALLOW_LOCAL_OPTION_SHADOW: "0"
      PAPER_TRADING: "true"
      TRIO_DEMAND_SUPPLY: "1"
      TRIO_TRADING_MODE: options_intraday
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements-server.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-server.lock

      - name: Validate Telegram bot tokens
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          failures = []
          for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_OPTIONS_BOT_TOKEN"):
              value = (os.environ.get(name) or "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1].strip()
              if not value:
                  if name == "TELEGRAM_BOT_TOKEN":
                      failures.append(name)
                  print(f"{name}: missing")
                  continue
              try:
                  response = requests.get(
                      f"https://api.telegram.org/bot{value}/getMe", timeout=10)
                  payload = response.json()
              except Exception as exc:
                  print(f"{name}: request failed ({type(exc).__name__})")
                  failures.append(name)
                  continue
              if response.status_code != 200 or not payload.get("ok"):
                  description = payload.get("description", "HTTP error")
                  print(f"{name}: rejected ({description})")
                  failures.append(name)
              else:
                  print(f"{name}: valid")
          if failures:
              print("Update the rejected GitHub Actions secret(s) with the raw token from @BotFather.")
              sys.exit(1)

      - name: Build options-only preview
        run: python scripts/premarket.py --trading-mode options_intraday

      - name: Persist plan to repo
        run: |
          set -euo pipefail
          mkdir -p output output/plans output/runtime output/chain_diagnostics
          touch output/equity_snapshot.json
          touch output/runtime/.gitkeep
          git config user.name "trio-bot"
          git config user.email "trio-bot@users.noreply.github.com"
          git add -A \
            output/plans \
            output/dashboard_state.json \
            output/subscribers.json \
            output/subscribers_options.json \
            output/equity_snapshot.json \
            output/runtime/.gitkeep \
            output/chain_diagnostics
          # Commit generated state before fetching origin so git merge never
          # aborts on an overlapping dirty output/plan file.
          if ! git diff --cached --quiet; then
            git commit -m "premarket plan $(date -u +%F)"
          fi
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git checkout --ours -- output/
            git add -A output/
            git -c core.editor=true merge --continue
          fi
          git push origin HEAD:main
