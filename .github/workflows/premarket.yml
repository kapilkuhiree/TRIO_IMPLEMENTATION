name: TRIO premarket plan

# Runs after the NSE close, ranks the NIFTY 100 on daily bars, writes
# output/plans/YYYY-MM-DD.json for the next session, and Telegrams a summary.
# Cron is UTC: 10:00 UTC = 15:30 IST, Mon-Fri.

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_OPTIONS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPTIONS_BOT_TOKEN }}
      TELEGRAM_OPTIONS_CHAT_ID: ${{ secrets.TELEGRAM_OPTIONS_CHAT_ID }}
      MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Build premarket plan
        run: python scripts/premarket.py

      - name: Persist plan to repo
        run: |
          set -euo pipefail
          mkdir -p output output/plans output/runtime
          touch output/equity_snapshot.json
          touch output/runtime/.gitkeep
          git config user.name "trio-bot"
          git config user.email "trio-bot@users.noreply.github.com"
          git add -A \
            output/plans \
            output/dashboard_state.json \
            output/subscribers.json \
            output/subscribers_options.json \
            output/equity_snapshot.json \
            output/runtime/.gitkeep
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git checkout --ours -- output/
            git add -A output/
            git -c core.editor=true merge --continue
          fi
          if ! git diff --cached --quiet; then
            git commit -m "premarket plan $(date -u +%F)"
          fi
          git push origin HEAD:main
