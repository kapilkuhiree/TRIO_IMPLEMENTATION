name: TRIO premarket plan

# Runs after the NSE close, ranks the NIFTY 100 on daily bars, writes
# output/plans/YYYY-MM-DD.json for the next session, and Telegrams a summary.
# Cron is UTC: 10:00 UTC = 15:30 IST, Mon-Fri.

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Build premarket plan
        run: python scripts/premarket.py

      - name: Persist plan to repo
        run: |
          git config user.name "trio-bot"
          git config user.email "trio-bot@users.noreply.github.com"
          git add -A output/plans output/dashboard_state.json output/subscribers.json
          git diff --cached --quiet || git commit -m "premarket plan $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push)