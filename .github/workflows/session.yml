name: TRIO session

# One long job for the NSE session: reads the premarket plan, places the
# orders at the open, then manages stops/targets/partials every minute until
# the 15:10 IST square-off. Cron is UTC: 03:48 UTC = 09:18 IST, Mon-Fri.
# Keep runtime below GitHub's hard 6h job cap so digest/state persistence runs.
# Public repo => unlimited minutes, so a ~6h job is free.

on:
  schedule:
    - cron: "48 3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_OPTIONS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPTIONS_BOT_TOKEN }}
      TELEGRAM_OPTIONS_CHAT_ID: ${{ secrets.TELEGRAM_OPTIONS_CHAT_ID }}
      MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
      TRIO_BROKER_PROVIDER: megabull
      TRIO_REMOTE_REQUIRED: "1"
      TRIO_ALLOW_LOCAL_OPTION_SHADOW: "0"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Validate Telegram bot tokens
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          failures = []
          for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_OPTIONS_BOT_TOKEN"):
              value = (os.environ.get(name) or "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1].strip()
              if not value:
                  if name == "TELEGRAM_BOT_TOKEN":
                      failures.append(name)
                  print(f"{name}: missing")
                  continue
              try:
                  response = requests.get(
                      f"https://api.telegram.org/bot{value}/getMe", timeout=10)
                  payload = response.json()
              except Exception as exc:
                  print(f"{name}: request failed ({type(exc).__name__})")
                  failures.append(name)
                  continue
              if response.status_code != 200 or not payload.get("ok"):
                  description = payload.get("description", "HTTP error")
                  print(f"{name}: rejected ({description})")
                  failures.append(name)
              else:
                  print(f"{name}: valid")
          if failures:
              print("Update the rejected GitHub Actions secret(s) with the raw token from @BotFather.")
              sys.exit(1)

      - name: Run session (place plan + manage to EOD)
        run: python scripts/session.py --interval 60 --max-seconds 21300

      - name: Send daily digest
        if: always()
        run: python scripts/digest.py || true

      - name: Persist state to repo
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output runtime output/plans output/chain_diagnostics
          touch output/equity_snapshot.json
          git config user.name "trio-bot"
          git config user.email "trio-bot@users.noreply.github.com"
          git add -A output/dashboard_state.json output/plans output/subscribers.json output/subscribers_options.json output/equity_snapshot.json output/runtime output/chain_diagnostics
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git checkout --ours -- output/
            git add -A output/
            git -c core.editor=true merge --continue
          fi
          if ! git diff --cached --quiet; then
            git commit -m "session state $(date -u +%F)"
          fi
          git push origin HEAD:main
