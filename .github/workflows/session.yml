name: TRIO session

# One long job for the NSE session: reads the premarket plan, places the
# orders at the open, then manages stops/targets/partials every minute until
# the 15:10 IST square-off. Cron is UTC: 03:40 UTC = 09:10 IST, Mon-Fri.
# Public repo => unlimited minutes, so a ~6h job is free.

on:
  schedule:
    - cron: "40 3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-server.txt

      - name: Run session (place plan + manage to EOD)
        run: python scripts/session.py --interval 60 --max-seconds 21600

      - name: Send daily digest
        if: always()
        run: python scripts/digest.py || true

      - name: Persist state to repo
        if: always()
        run: |
          git config user.name "trio-bot"
          git config user.email "trio-bot@users.noreply.github.com"
          git add -A output/dashboard_state.json output/plans output/subscribers.json
          git diff --cached --quiet || git commit -m "session state $(date -u +%F)"
          git pull --rebase --autostash || true
          # State files append JSON lines; merge upstream instead of
          # failing on conflict (trade_log is no longer tracked, so the
          # old merge-conflict failure mode is gone).
          git push || (git pull --rebase --autostash && git push)