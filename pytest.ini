[pytest]
# scripts/test_zerodha_*.py are manual live diagnostics, not offline tests:
# they call load_env() (and one performs live API calls) at import time, which
# leaks the operator's .env broker/provider settings into the whole run and
# reroutes every NSE chain test to Zerodha.  Keep them runnable directly with
# `python scripts/test_zerodha_....py`, but out of pytest collection.
norecursedirs = scripts .git .* build dist node_modules venv output
