options:
  enabled: true
  broker: "megabull"
  underlying: "NIFTY"
  lot_size: 65                # NIFTY lot from Jan 2026: 65 (was 75); per spec §3
  strike_step: 50             # NIFTY strike granularity
  max_spreads_per_session: 4  # hard cap: one position id per session max
  style: "long"               # spread | long
  delta_atm: 0.50             # long leg ~ATM (spread mode)
  delta_otm: 0.30             # short leg ~OTM (spread mode only)
  delta_long: 0.65            # long-only mode: target delta for ITM strike
  min_oi: 1000                # skip wing when OI below this (illiquid)
  max_iv_rank: 80             # rich vol: penalty 0.5 on option rank
  chain_cache_minutes: 15     # NSE chain TTL intraday
  risk_free_rate: 0.065       # BS fallback only
  max_premium_pct: 5.0        # skip when premium > 5% of spot (junk)
  expiry_preference: "weekly" # weekly tactical + monthly swing (both swept)
  paper_only: true            # live Kite place_order stays OFF until proven
  # Fill realism (spec §6): BUY at ask, SELL at bid, plus slippage.
  fill_model: "bidask"        # mid | bidask (mid = legacy, bidask = execution-realistic)
  slippage_ticks: 0.5         # extra slippage per leg in ticks (1 tick = 0.05)
  brokerage_per_order: 20     # Rs per order leg (broker sheet rate)
  stt_rate_sold: 0.0015       # STT 0.15% of premium on sold legs (from 2026-04-01 per spec §3)
  # Expiry-day trades as a separate experiment
  paper_only: true